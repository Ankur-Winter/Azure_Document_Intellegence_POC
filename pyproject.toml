[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-document-intelligence-poc"
version = "0.1.0"
description = "A small benchmark CLI for Azure AI Document Intelligence"
requires-python = ">=3.9"
dependencies = [
  "azure-ai-documentintelligence>=1.0.0,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
]

[project.scripts]
docintel-poc = "docintel_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docintel_poc = ["dashboard.html"]

